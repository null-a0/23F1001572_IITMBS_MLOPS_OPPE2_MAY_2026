apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heart-disease-api
  template:
    metadata:
      labels:
        app: heart-disease-api
    spec:
      containers:
        - name: heart-disease-api
          image: us-central1-docker.pkg.dev/project-0a6400db-0297-4323-a8f/oppe2-repo/heart-disease-api:1.0
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
            limits:
              cpu: "500m"
